name: datastream
description: "DataStream - Earn free global eSIM data and promote social accounts."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core & Products
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.1
  firebase_storage: ^12.4.0
  google_sign_in: ^6.2.2

  # Device Hardware Tracking
  device_info_plus: ^10.1.0

  # UI & Networking
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  qr_flutter: ^4.1.0

  # Ad & Offerwall Engine
  flutter_tapjoy: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
